<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/loginRegister.css">
  <title>Kelper - Register</title>
</head>

<body onload="listar()">
  <div class="container">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="content">
      <figure class="logo"><img src="./assets/img/LOGO.png" alt="Logo Kelper"></figure>
      <h1>Olá, Piscicultor. Vamos começar?</h1>
      <form action="" class="register">
        <div class="group">
          <div class="input">
            <p>Nome</p>
            <input type="text" placeholder="João" id="nome_input">
          </div>
          <div class="input">
            <p>Sobrenome</p>
            <input type="text" placeholder="Silva" id="ipt_sobrenome">
          </div>
        </div>
        <div class="group">
          <div class="input">
            <p>E-mail</p>
            <input type="text" placeholder="joao@gmail.com" id="email_input">
          </div>
          <div class="input">
            <p>CPF</p>
            <input type="text" placeholder="12345678910" id="cpf_input">
          </div>
        </div>
        <div class="group">
          <div class="input">
            <p>Senha</p>
            <input type="password" placeholder="********" id="senha_input">
          </div>
          <div class="input">
            <p>Confirmar senha</p>
            <input type="password" placeholder="********" id="confirmacao_senha_input">
          </div>
        </div>
        <div class="input">
          <p>Código de ativação</p>
          <input type="text" placeholder="ABC123" id="codigo_input">
        </div>

        <button type="button" onclick="cadastrar()" class="hover1">Registrar</button>
        <div class="register-a">
          <span>Já possui uma conta? </span><a href="login.html">Entre aqui!</a>
        </div>
      </form>
    </div>
    <figure>
      <img src="./assets/img/fishes.jpg" alt="Imagem de cardume nadando">
    </figure>
  </div>
</body>

</html>

<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaEmpresasCadastradas = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var cpfVar = cpf_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var codigoVar = codigo_input.value;
    var idEmpresaVincular

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      cpfVar == "" ||
      confirmacaoSenhaVar == "" ||
      codigoVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      // finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Verificando se o código de ativação é de alguma empresa cadastrada
    for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
      if (listaEmpresasCadastradas[i].codigo == codigoVar) {
        idEmpresaVincular = listaEmpresasCadastradas[i].id
        console.log("Código de ativação válido.");
        break;
      } else {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
        // finalizarAguardar();
      }
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        cpfServer: cpfVar,
        senhaServer: senhaVar,
        idEmpresaVincularServer: idEmpresaVincular
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          // finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        // finalizarAguardar();
      });

    return false;
  }

  // Listando empresas cadastradas 
  function listar() {
    fetch("/empresas/listar", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((empresas) => {
          empresas.forEach((empresa) => {
            listaEmpresasCadastradas.push(empresa);

            console.log("listaEmpresasCadastradas")
            console.log(listaEmpresasCadastradas[0].codigo)
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
