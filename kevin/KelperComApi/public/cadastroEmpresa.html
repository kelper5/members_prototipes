<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/loginRegister.css">
</head>

<body>
    <div class="container">
        <div class="container">
            <div class="alerta_erro">
                <div class="card_erro" id="cardErro">
                    <span id="mensagem_erro"></span>
                </div>
            </div>
            <div class="content">
                <figure class="logo"><img src="./assets/img/LOGO.png" alt="Logo Kelper"></figure>
                <form action="" class="register">
                    <div class="group">
                        <div class="input">
                            <span>Razão Social</span>
                            <input type="text" id="razao_social_input">
                        </div>
                        <div class="input">
                            <span>CNPJ</span>
                            <input type="text" id="cnpj_input">
                        </div>
                    </div>
                    <div class="group">
                        <div class="input">
                            <span>Nome da empresa matriz (se houver)</span>
                            <input type="text" id="matriz_input">
                        </div>
                        <div class="input">
                            <span>Código autenticação</span>
                            <input type="text" id="codigo_input">
                        </div>
                    </div>
                    <hr>
                    <div class="group">
                        <div class="input">
                            <span>CEP da empresa</span>
                            <input type="text" id="endereco_input">
                        </div>
                        <div class="input">
                            <span>Numero</span>
                            <input type="text" id="numero_endereco_input">
                        </div>
                    </div>
                    <button onclick="cadastrar()">Cadastrar</button>
            </div>
            <div class="fundop"></div>
        </div>
    </div>
</body>

</html>
<script>

    async function cadastrar() {

        var razaoSocialVar = razao_social_input.value;
        var cnpjVar = cnpj_input.value;
        var matrizVar = matriz_input.value;
        var enderecoVar = endereco_input.value;
        var numeroEnderecoVar = numero_endereco_input.value;
        var codigoVar = codigo_input.value

        if (
            razaoSocialVar == "" ||
            cnpjVar == "" ||
            enderecoVar == "" ||
            numeroEnderecoVar == "" ||
            codigoVar == ""
        ) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML =
                "Preencha todos os campos";
            return false;
        }

        try {
            const respostaEndereco =
                await fetch("/enderecos/cadastrar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        cepServer: enderecoVar
                    }),
                });

            if (!respostaEndereco.ok) {
                throw "Erro ao cadastrar endereço";
            }

            const enderecoInfos = await respostaEndereco.json();
            const idEndereco = enderecoInfos.insertId;
            const respostaEmpresa =
                await fetch("/empresas/cadastrar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        razaoSocialServer: razaoSocialVar,
                        cnpjServer: cnpjVar,
                        matrizServer: matrizVar,
                        fkEnderecoServer: idEndereco,
                        numeroEnderecoServer: numeroEnderecoVar,
                        codigoServer: codigoVar
                    }),
                });

            if (!respostaEmpresa.ok) {
                throw "Erro ao cadastrar empresa";
            }
            console.log("Empresa cadastrada");
        } catch (erro) {
            console.log(erro);
        }
    }

</script>
