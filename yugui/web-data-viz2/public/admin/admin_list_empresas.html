<script>

    var empresasTotais = 0

    async function exibirEmpresas() {



        let resposta = await fetch(`/empresas/listar/`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
            },

        });

        let respostaJson = await resposta.json()
        empresasTotais = respostaJson.length
        console.log(respostaJson)

        empresasOut.innerHTML = empresasTotais

        respostaJson.forEach(item => {
            insertCards.innerHTML += `
            <div class="viveiro">
                <h1>${item.razao_social}</h1>
                <div class="stats">
                    <span>CNPJ: ${item.cnpj}</span>
                    <span>Código: ${item.codigo_ativacao}</span>
                </div>
            </div>
            
            
            
            `
        });
