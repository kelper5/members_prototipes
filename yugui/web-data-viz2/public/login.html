<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Kelper - Login</title>
</head>

<body>
    <div class="container">
        <div class="content">
            <div class="exitBtn">
                <a href="./index.html"><img src="./assets/img/reject.png" alt=""></a>
            </div>
            <figure class="logo"><img src="./assets/img/LOGO.png" alt="Logo Kelper"></figure>
            <h1>Seja Bem-Vindo Novamente!</h1>
            <form action="" class="login">
                <div class="input">
                    <p>E-mail</p>
                    <input type="email" placeholder="exemplo@gmail.com" id="email_input">
                </div>
                <div class="input">
                    <p>Senha</p>
                    <input type="password" placeholder="********" id="senha_input">
                </div>
                <button type="button" class="hover1" onclick="entrar()">Entrar</button>
                <div class="register-a">
                    <span>Não possui uma conta? </span><a href="cadastro.html">Cadaste-se aqui!</a>
                </div>
            </form>
        </div>
        <figure>
            <img src="./assets/img/fishes.jpg" alt="Imagem de cardume nadando">
        </figure>
    </div>
</body>

</html>

<script>


    function entrar() {
        // aguardar();

        const emailVar = email_input.value;
        const senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            // cardErro.style.display = "block"
            // mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            // finalizarAguardar();
            return false;
        }
        else {
            // setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email_server: emailVar,
                senha_server: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")
            console.log(resposta)
            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.NOME_EMPRESA = json.empresaNome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.ID_EMPRESA = json.empresaId;
                    sessionStorage.VIVEIROS = JSON.stringify(json.viveiros)
                    if (json.empresaId == 1) {
                        setTimeout(function () {
                            window.location = "./admin/admin_page.html";
                        }, 1000); // apenas para exibir o loading
                    } else {
                        setTimeout(function () {
                            window.location = "./dashboard/cards.html";
                        }, 1000); // apenas para exibir o loading
                    }

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    // finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    // function sumirMensagem() {
    //     cardErro.style.display = "none"
    // }

</script>
