<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BobIA</title>
    <!-- <link rel="stylesheet" href="../css/bob.css"> -->
    <link rel="stylesheet" href="../css/dash.css">
</head>

<body>

    <div class="container" id="container">
        <div class="navBar">
            <figure>
                <img src="./img/LOGO.png" alt="">
            </figure>
            <ul>
                <li>Menu</li>
                <li class="hover4"><a href="./dashboard.html">Gráficos</a></li>
                <li class="selected"><a href="./dashViveiros.html">Viveiros</a></li>
                <li class="hover4"><a href="./dashAlerts.html">Alertas</a></li>
                <li class="hover4"><a href="./cadastroViveiro.html">Cadastrar Viveiro</a></li>
                <li class="red hover5"><a href="./login.html">LOG OUT</a></li> <!-- TEM QUE LIMPAR SEssÃo -->
            </ul>
        </div>
        <div class="contentBob">
            <h1>Área de ajuda ao cliente</h1>
            <p>Tire sua dúvida agora mesmo com o nosso agente de IA, o Bob! Digite sua dúvida na caixa abaixo e aguarde
                uma resposta.</p>
            <div class="chatBox">
                <div class="messages" id="messages">
                    
                </div>
                <div class="inputsBob"><textarea id="pergunta" type="text" placeholder="Digite a pergunta..."></textarea><button onclick="gerarResposta()" class="hover">Gerar Resposta</button></div>
            </div>

            
            <h3>Resposta da IA:</h3>
            <div id="resposta"></div>
        </div>
    </div>

    <script>

        async function gerarResposta() {
            const pergunta = document.getElementById('pergunta').value;
            messages.innerHTML += `
            <div class="question">
                <div class="questionMessage" id="">${pergunta}</div>
            </div>
            `

            const response = await fetch('/bob/perguntar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ pergunta })
            });

            const data = await response.json();
            console.log(data)
            resposta.style.display = 'block';
            messages.innerHTML += `
            <div class="answer">
                <div class="answerMessage">${data}</div>
            </div>
            `;
        }

    </script>

</body>

</html>
