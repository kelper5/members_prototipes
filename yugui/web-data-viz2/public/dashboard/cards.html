<body onload="exibirViveiros(), atualizacaoPeriodica()">

    <header></header>
    <main>
        <div class="container">
            <div class="navBar">
                <figure>
                    <img src="./img/LOGO.png" alt="">
                </figure>
                <ul>
                    <li>Menu</li>
                    <li class="hover4"><a href="./dashboard.html">Gráficos</a></li>
                    <li class="selected"><a href="./dashViveiros.html">Viveiros</a></li>
                    <li class="hover4"><a href="./dashAlerts.html">Alertas</a></li>
                    <li class="hover4"><a href="./cadastroViveiro.html">Cadastrar Viveiro</a></li>
                    <li class="red hover5"><a href="./login.html">LOG OUT</a></li> <!-- TEM QUE LIMPAR SEssÃo -->
                </ul>
            </div>
            <div class="content">
                <div class="viveiros" id="insertCards">
                    <div class="kpiViveiros">
                        <p>Viveiros Ativos: <span id="viveirosAtivosOut"></span>/<span id="viveirosTotaisOut"></span>
                        </p>
                    </div>

                </div>
            </div>
        </div>
        </div>
    </main>
    <footer></footer>

</body>

<script>

    var viveirosTotais = 0
    var viveirosAtivos = 0

    async function exibirViveiros() {
        console.log(sessionStorage.VIVEIROS)

        await JSON.parse(sessionStorage.VIVEIROS).forEach(async item => {
            console.log("ITEM:");
            console.log(item);

            console.log("ID ARDUINO:");
            console.log(item.idArduino);
            viveirosTotais++
            if (item.status_arduino == 1) {
                viveirosAtivos++
            }


            let resposta = await fetch(`/capturas/ultimosViveiro/${item.idArduino}`, {
                method: "GET",
                headers: {
                    "Content-Type": "application/json",
                },

            });

            let respostaJson = await resposta.json()
            var temperatura
            var luminosidade
            var situacao = "green"

            if (respostaJson[0].temperatura != null) {
                temperatura = respostaJson[0].temperatura
            }else{
                temperatura = 0
            }

            if (respostaJson[0].luminosidade != null) {
                luminosidade = respostaJson[0].luminosidade
            }else{
                luminosidade = 0
            }

            if(respostaJson[0].status_arduino == 0){
                situacao == red
            }

            document.getElementById("insertCards").innerHTML +=
                `
                    <div class="viveiro">
                        <h1>${item.nome}</h1>
                        <div class="stats">
                            <span>Temperatura: ${temperatura} C</span>
                            <span>Luminosidade: ${luminosidade}</span>
                            <span  class="${situacao}">Status: ATIVO</span>
                        </div>
                    </div>
                    `

            viveirosTotaisOut.innerHTML = viveirosTotais
            viveirosAtivosOut.innerHTML = viveirosAtivos
        });


    }

</script>

</html>
