<body onload="validarSessao(), exibirAquarios(),  atualizacaoPeriodica()">

    <header></header>
    <main>
        <div class="container">
            <div class="navBar">
                <figure>
                    <img src="./img/LOGO.png" alt="">
                </figure>
                <ul>
                    <li>Menu</li>
                    <li class="hover4"><a href="./dashMain.html">Gráficos</a></li>
                    <li class="selected"><a href="./dashViveiros.html">Viveiros</a></li>
                    <li class="hover4"><a href="./dashAlerts.html">Alertas</a></li>

                </ul>
            </div>
            <div class="content">
                <div class="viveiros" id="insertCards">
                    <div class="kpiViveiros">

                    </div>
                    <div class="viveiro">
                        <h1>Viveiro Molde</h1>
                        <div class="stats">

        </div>

</body>

<script>

    function exibirViveiros() {
        console.log(sessionStorage.VIVEIROS)
        JSON.parse(sessionStorage.VIVEIROS).forEach(item => {
            document.getElementById("insertCards").innerHTML +=
                `
                    <div class="viveiro">
                        <h1>${item.nome}</h1>
                        <div class="stats">
                            <span>Temperatura: 29C</span>
                            <span>Luminosidade: 20.000</span>
                            <span  class="green">Status: ATIVO</span>
                        </div>
                    </div>
                    `
        });
    }

</script>
