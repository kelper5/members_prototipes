        rel="stylesheet">

<body onload="exibirAlertas()">
    <header></header>
    <main>
        <div class="container">
            <div class="navBar">
                <figure>
                    <img src="./img/LOGO.png" alt="">
                </figure>
                <ul>
                    <li>Menu</li>
                    <li class="selected"><a href="./alertas.html">Alertas</a></li>
                    <li class="hover4"><a href="./dashboard.html">Gráficos</a></li>
                    <li class="hover4"><a href="./cards.html">Viveiros</a></li>
                    <li class="hover4"><a href="./bob.html">Ajuda</a></li>
                    <li class="red hover5"><a href="./login.html">LOG OUT</a></li> <!-- TEM QUE LIMPAR SEssÃo -->
                </ul>
            </div>
            <div class="content">
                <div class="viveiros" id="insertCards">
                    <div class="kpiViveiros">
                        <p>Alertas Totais: <span id="alertasOut">0</span></p>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </main>
    <footer></footer>

</body>

<script>

    var alertasTotais = 0

    async function exibirAlertas() {
        console.log(sessionStorage.ALERTA)

        await JSON.parse(sessionStorage.ALERTA).forEach(async item => {
            console.log("ITEM:");
            console.log(item);

            console.log("ID ARDUINO:");
            console.log(item.idArduino);

            let classe = ""
            let risco = ""

            if(item.ire >0.5 && item.ire <1.0){
                classe = "baixoAlerta"
                risco = "BAIXO"
            }else if(item.ire >=1.0 && item.ire <2.0){
                classe = "medioAlerta"
                risco = "MÉDIO"
            }else if(item.ire >= 2.0){
                classe = "altoAlerta"
                risco = "ALTO"
            }

            alertasTotais++

            document.getElementById("insertCards").innerHTML +=
                `
                    <div class="viveiro">
                        <h1>${item.viveiroNome}</h1>
                        <div class="stats">
                            <span>IRE: ${item.ire}</span>
                            <span class = "">Risco: <span class = ${classe}>${risco}</span></span>
                        </div>
                    </div>
                    `

            alertasOut.innerHTML = alertasTotais
        });


    }

</script>

</html>
